<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Client</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .status {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status.connected { color: #25D366; }
    .status.qr_required { color: #f0a500; }
    .status.disconnected { color: #e74c3c; }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    .phone {
      font-size: 16px;
      color: #25D366;
      margin-bottom: 20px;
    }
    .qr-container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      display: inline-block;
      margin-top: 16px;
    }
    .qr-container img {
      display: block;
      width: 260px;
      height: 260px;
    }
    .hint {
      font-size: 13px;
      color: #666;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status" id="status">Loading...</div>
    <h1>WhatsApp Client</h1>
    <div id="content"></div>
  </div>

  <script>
    async function poll() {
      try {
        const res = await fetch('api/status');
        const data = await res.json();
        const statusEl = document.getElementById('status');
        const contentEl = document.getElementById('content');

        statusEl.textContent = data.status.replace(/_/g, ' ');
        statusEl.className = 'status ' + data.status;

        if (data.status === 'connected' && data.connected_number) {
          contentEl.innerHTML = `<div class="phone">📱 ${data.connected_number}</div>`;
        } else if (data.status === 'qr_required' && data.qr_data_url) {
          contentEl.innerHTML = `
            <div class="qr-container"><img src="${data.qr_data_url}" alt="QR Code"></div>
            <div class="hint">Open WhatsApp → Settings → Linked Devices → Link a Device</div>
          `;
        } else {
          contentEl.innerHTML = `<div class="hint">Waiting...</div>`;
        }
      } catch (e) {
        document.getElementById('status').textContent = 'error';
      }
    }

    poll();
    setInterval(poll, 3000);
  </script>
</body>
</html>
